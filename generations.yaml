generations:
  - name: "First Generation (GMT400)"
    start_year: 1988
    end_year: 1998
    description: "The first-generation Sierra 1500 (though the '1500' designation wasn't used until later) established GMC's full-size pickup as a distinct model from Chevrolet with more premium positioning. Built on GM's GMT400 platform, it featured more aerodynamic styling than its predecessor. Available in regular cab and extended cab configurations with various bed lengths, it offered versatility for different uses. Engine options included V6 and V8 gasoline engines, plus a 6.2L/6.5L diesel option. The interior was more car-like than previous generations, with better ergonomics and comfort features. This generation introduced many innovations including an independent front suspension for improved ride quality, and was the first American pickup to offer a third door on extended cab models in 1996."

  - name: "Second Generation (GMT800)"
    start_year: 1999
    end_year: 2006
    description: "The second-generation Sierra 1500 (first generation Silverado/Sierra) was released in August 1998 as a 1999 model, sharing the GMT800 platform with Chevrolet Silverado. This generation featured more distinctive styling to differentiate it from its Chevrolet counterpart, with unique front fascia, interior trim, and available features. It offered regular cab, extended cab, and the new crew cab configurations. Powertrain options included various Vortec V8 engines, with a focus on improved power and efficiency. The interior was significantly more refined, with better materials and design, particularly in upscale trims like the Denali. This generation saw the introduction of the luxury-oriented Sierra Denali as a distinct model, establishing GMC's premium positioning in the truck market. A significant update in 2002 refreshed the styling and interior while adding features and technology."

  - name: "Third Generation (GMT900)"
    start_year: 2007
    end_year: 2013
    description: "The third-generation Sierra 1500 (second generation Silverado/Sierra) arrived in the last quarter of 2006 as a 2007 model, built on GM's GMT900 platform. It featured a redesigned exterior, interior, frame, and suspension as well as power increases on certain engines. The new Silverado earned the North American Truck of the Year award for 2007 and was Motor Trend magazine's Truck of the Year for 2007. Engine options evolved to include more efficient V8s with features like Active Fuel Management (cylinder deactivation). The interior saw significant improvements in design, material quality, and technology. Production continued until 2013."

  - name: "Fourth Generation (K2XX)"
    start_year: 2014
    end_year: 2018
    description: "The fourth-generation Sierra 1500 (third generation Silverado/fourth generation Sierra) was introduced in December 2012 for the 2014 model year, built on GM's K2XX platform. Production ran from April 2013 through 2018 for the 1500 model. This generation featured a fully-redesigned exterior with three all-new gasoline engine options: a 4.3L EcoTec3 V6, a 5.3L EcoTec3 V8, and a 6.2L EcoTec3 V8, all featuring cylinder deactivation and aluminum blocks. A 2016 mid-cycle refresh brought a new grille, headlights, and front fascia with design influences from the 2015 Chevrolet Colorado. The luxury-oriented Denali trim expanded its prominence, featuring distinctive styling and more premium appointments. For 2019, the previous-generation truck was sold as 'GMC Sierra Limited' alongside the new generation until production ended in December 2019."

  - name: "Fifth Generation (T1XX)"
    start_year: 2019
    end_year: null
    description: "The current Sierra 1500 (fourth generation Silverado/fifth generation Sierra) features the most differentiation from its Chevrolet counterpart in the model's history, with unique styling, features, and technology. Built on GM's T1XX platform (production started July 2018), it offers reduced weight while increasing capability and refinement. Engine options include a turbocharged four-cylinder, V6, and multiple V8 options, plus a 3.0L Duramax diesel. The interior represents a significant step forward in design and technology, particularly in higher trims, with available features including a 15-inch head-up display, digital rearview mirror, and multi-color touchscreen interfaces. Innovative features include the MultiPro tailgate with six functions, available CarbonPro carbon fiber composite bed, and transparent trailer view camera system."